<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log de Errores — ML Scraper VE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      line-height: 1.6;
    }
    .topbar {
      background: linear-gradient(135deg, #2d3277 0%, #3483fa 100%);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .topbar h1 { margin: 0; font-size: 18px; }
    .topbar .stats { font-size: 12px; opacity: 0.85; }
    .topbar-right { display: flex; gap: 8px; align-items: center; }
    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-danger { background: #ff5252; color: #fff; }
    .btn-secondary { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.25); }

    .filters {
      padding: 10px 24px;
      background: #16213e;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      border-bottom: 1px solid #0f3460;
    }
    .filters input, .filters select {
      background: #1a1a2e;
      color: #eee;
      border: 1px solid #0f3460;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 12px;
    }
    .filters label { font-size: 11px; color: #aaa; }

    #log-container {
      padding: 12px 24px;
      font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
      font-size: 12px;
      line-height: 1.7;
      max-width: 100%;
    }
    .log-entry {
      padding: 6px 10px;
      margin-bottom: 3px;
      border-radius: 4px;
      background: #16213e;
      border-left: 3px solid #666;
      word-break: break-word;
    }
    .log-entry.http-4xx, .log-entry.http-5xx { border-left-color: #ff9800; }
    .log-entry.parse { border-left-color: #e91e63; }
    .log-entry.visit { border-left-color: #9c27b0; }
    .log-entry.deep { border-left-color: #ff5252; }
    .log-entry.csv { border-left-color: #00bcd4; }
    .log-entry.redirect { border-left-color: #4caf50; }

    .log-ts { color: #888; margin-right: 8px; }
    .log-type { font-weight: bold; margin-right: 8px; }
    .log-type.http-4xx, .log-type.http-5xx { color: #ff9800; }
    .log-type.parse { color: #e91e63; }
    .log-type.visit { color: #9c27b0; }
    .log-type.deep { color: #ff5252; }
    .log-type.csv { color: #00bcd4; }
    .log-type.redirect { color: #4caf50; }
    .log-type.other { color: #ff5252; }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }
    .empty h2 { color: #4caf50; }

    .badge {
      background: #ff5252;
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>📋 Log de Errores / Debug</h1>
      <div class="stats" id="log-stats">Cargando…</div>
    </div>
    <div class="topbar-right">
      <button class="btn btn-secondary" id="btn-refresh">↻ Refrescar</button>
      <button class="btn btn-secondary" id="btn-export">⬇ Exportar TXT</button>
      <button class="btn btn-danger" id="btn-clear">🗑 Limpiar Log</button>
    </div>
  </div>

  <div class="filters">
    <label>Filtrar:</label>
    <input type="text" id="filter-text" placeholder="Buscar texto…" style="flex:1; min-width:200px;">
    <label>Tipo:</label>
    <select id="filter-type">
      <option value="">Todos</option>
      <option value="HTTP">HTTP 4xx/5xx</option>
      <option value="PARSE">Parse errors</option>
      <option value="VISIT">Visit API</option>
      <option value="DEEP">Deep fetch</option>
      <option value="CSV">CSV export</option>
      <option value="REDIRECT">Redirects</option>
    </select>
  </div>

  <div id="log-container">
    <div class="empty">
      <div class="spinner" style="width:30px;height:30px;border:3px solid #333;border-top-color:#3483fa;border-radius:50%;margin:0 auto 12px;animation:spin 0.8s linear infinite;"></div>
      Cargando log…
    </div>
  </div>

  <script src="error-log.js"></script>
</body>
</html>
